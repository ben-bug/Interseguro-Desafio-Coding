server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos de texto. Los .js y .css del build son la mayor
    # parte de la transferencia y comprimen muy bien.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Encabezados de seguridad básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los recursos del build llevan hash en el nombre, así que pueden cachearse
    # de forma indefinida: un cambio produce un nombre distinto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html nunca se cachea: es lo que apunta a los assets con hash, y
        # una copia vieja seguiría pidiendo los archivos del build anterior.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Todas las llamadas a la API se redirigen a la API Go por la red interna de
    # Docker. Así el navegador solo habla con un origen: no hay CORS que
    # resolver ni una URL de API que cambie entre entornos.
    location /api/ {
        proxy_pass http://api-go:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Margen suficiente para una factorización grande sin dejar la conexión
        # colgada de forma indefinida si la API deja de responder.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # El frontend envía matrices completas en el cuerpo.
        client_max_body_size 16m;
    }
}
