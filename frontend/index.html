<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorización QR · Interseguro</title>
    <meta
      name="description"
      content="Descompone una matriz en Q · R y calcula estadísticas sobre el resultado."
    />

    <!-- Favicon vectorial: nítido en cualquier densidad de pantalla y sin las
         versiones en varios tamaños que exige un PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- El color de marca tiñe la barra del navegador en Android y la interfaz
         de la aplicación cuando se instala desde el navegador. -->
    <meta name="theme-color" content="#0855c4" />

    <!--
      La tipografía se resuelve con la pila del sistema y no se carga desde un
      servicio externo. Tres razones: la fuente aparece de inmediato, sin el
      parpadeo de texto sin estilo mientras se descarga; la aplicación sigue
      viéndose igual en una red restringida o sin salida a internet, que es
      justo el entorno donde suele desplegarse una herramienta interna; y la
      dirección IP de quien la usa no llega a un tercero solo por abrir la
      página. El detalle de la pila está en styles.css.
    -->

    <!--
      Se aplica el tema guardado antes de pintar nada.

      Si esto viviera dentro del JavaScript de la aplicación, el navegador
      alcanzaría a dibujar un fotograma con el tema del sistema y el usuario
      vería un destello claro antes de que apareciera el oscuro. El script va en
      línea y sin `defer` a propósito: bloquea el render lo justo para evitarlo.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('qr-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* Sin acceso a localStorage manda la preferencia del sistema. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
